# Maestro Flow: Player Login
# Simulates logging in with demo OTP.
#
# Run: maestro test maestro/player-login.yaml

appId: com.kocourt.player

---

# 1. Launch app
- launchApp
- waitForAnimationToEnd:
    timeout: 10000

# 2. Go to Profile tab (triggers login)
- tapOn: "PROFILE"
  optional: true
- waitForAnimationToEnd:
    timeout: 5000

# 3. If we see a login screen, enter phone number
- tapOn:
    id: "phone_field"
  optional: true
- inputText: "9000000099"
  optional: true
- waitForAnimationToEnd

# 4. Tap Send OTP / Continue button
- tapOn: "Send OTP"
  optional: true
- tapOn: "Continue"
  optional: true
- waitForAnimationToEnd:
    timeout: 5000

# 5. Enter demo OTP (1234)
- inputText: "1234"
  optional: true
- waitForAnimationToEnd

# 6. Tap Verify button
- tapOn: "Verify"
  optional: true
- tapOn: "Submit"
  optional: true
- waitForAnimationToEnd:
    timeout: 5000

# 7. If name entry screen shows, enter name
- inputText: "TestPlayer"
  optional: true
- tapOn: "Save"
  optional: true
- tapOn: "Continue"
  optional: true
- waitForAnimationToEnd:
    timeout: 5000

# 8. Should now be on home/profile screen logged in
- takeScreenshot: "login-complete"
