# Navigate to chat, check conversations
# Tags: chat
appId: com.kocourt.player
tags:
  - chat
---
- launchApp
- runFlow: subflows/login.yaml

# Navigate to Profile tab
- tapOn:
    id: "nav_profile"
- waitForAnimationToEnd:
    timeout: 3000

# Tap Chat / Messages option
- tapOn: "Chat"
  optional: true
- tapOn: "Messages"
  optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: "chat-list"

# If conversations exist, tap the first one
- tapOn:
    index: 0
    retryTapIfNoChange: false
  optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: "chat-conversation"

# Go back
- back
