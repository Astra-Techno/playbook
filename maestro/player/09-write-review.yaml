# PERSONA: Player who just finished playing, wants to review the venue
# SCENARIO: Opens a venue, scrolls to reviews, writes a review with rating
# Like leaving a Google review after visiting a restaurant
tags:
  - review
  - auth
---
- launchApp
- runFlow: subflows/login.yaml

# Open a venue
- tapOn:
    id: "nav_explore"
- scrollUntilVisible:
    element: "Book Now"
    direction: DOWN
    timeout: 10000
  optional: true
- tapOn: "Book Now"
  optional: true
- waitForAnimationToEnd:
    timeout: 5000

# Scroll down to reviews section
- scrollUntilVisible:
    element: "Reviews"
    direction: DOWN
    timeout: 10000
  optional: true
- takeScreenshot: "reviews-section"

# Tap write review button
- tapOn: "Write a Review"
  optional: true
- tapOn: "Add Review"
  optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: "review-form"

# Tap star rating (try 4 or 5 stars)
- tapOn: "5"
  optional: true
- takeScreenshot: "review-stars-selected"

# Type review text
- tapOn: "Write your review"
  optional: true
- inputText: "Great venue! Clean courts and friendly staff."
  optional: true
- takeScreenshot: "review-typed"

# Submit
- tapOn: "Submit"
  optional: true
- tapOn: "Post"
  optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: "review-submitted"

# Go back
- back
- back
  optional: true
