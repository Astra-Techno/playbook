# PERSONA: Player ready to book a court
# SCENARIO: Selects a venue, picks a date, selects time slot, proceeds to pay
# Like booking a movie ticket on BookMyShow — pick date, time, pay
tags:
  - booking
  - payment
  - auth
---
- launchApp
- runFlow: subflows/login.yaml

# Go to explore and open a venue
- tapOn:
    id: "nav_explore"
- scrollUntilVisible:
    element: "Book Now"
    direction: DOWN
    timeout: 10000
  optional: true
- tapOn: "Book Now"
  optional: true
- waitForAnimationToEnd:
    timeout: 5000

# Scroll to slot section
- scrollUntilVisible:
    element: "Select Slot"
    direction: DOWN
    timeout: 10000
  optional: true
- takeScreenshot: "booking-slot-section"

# Try changing date — tap tomorrow or next available
- tapOn: "Tomorrow"
  optional: true
- tapOn: "Today"
  optional: true
- waitForAnimationToEnd:
    timeout: 3000

# Select a time slot
- tapOn: "Select Slot"
  optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: "booking-slot-selected"

# Proceed to checkout
- tapOn: "Proceed to Pay"
  optional: true
- tapOn: "Continue to pay"
  optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: "booking-checkout-screen"

# Payment dialog / review screen should appear
- tapOn: "Confirm"
  optional: true
- tapOn: "Pay"
  optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: "booking-payment"

# Go back
- back
- back
  optional: true
