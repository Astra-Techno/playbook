# PERSONA: A real player's complete session — like a 30-minute app session
# SCENARIO: Login > Browse > Check venue > Book > Feed > Match > Chat > Profile
# Like how you use Instagram: scroll feed, check stories, DM someone, post
tags:
  - e2e
  - full
---
- launchApp

# 1. Sign up / Login
- runFlow: subflows/login.yaml
- takeScreenshot: "journey-01-logged-in"

# 2. Browse venues like scrolling a feed
- tapOn:
    id: "nav_explore"
- scroll:
    direction: DOWN
    duration: 2000
- waitForAnimationToEnd
- takeScreenshot: "journey-02-browsing"

# 3. Check out a venue
- scroll:
    direction: UP
    duration: 2000
- scrollUntilVisible:
    element: "Book Now"
    direction: DOWN
    timeout: 10000
  optional: true
- tapOn: "Book Now"
  optional: true
- waitForAnimationToEnd:
    timeout: 5000
- scroll:
    direction: DOWN
    duration: 3000
- takeScreenshot: "journey-03-venue-detail"
- back

# 4. Check community feed
- tapOn:
    id: "nav_feed"
- waitForAnimationToEnd:
    timeout: 5000
- scroll:
    direction: DOWN
    duration: 1500
- takeScreenshot: "journey-04-feed"

# 5. Browse match requests
- tapOn:
    id: "nav_matches"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: "journey-05-matches"

# 6. Check bookings
- tapOn:
    id: "nav_bookings"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: "journey-06-bookings"

# 7. Check profile and settings
- tapOn:
    id: "nav_profile"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: "journey-07-profile"

# 8. Open messages
- tapOn: "Messages"
  optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: "journey-08-messages"
- back

# 9. Check notifications
- tapOn: "Open notifications"
  optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: "journey-09-notifications"
- back
  optional: true

# 10. Back to home
- tapOn:
    id: "nav_explore"
- takeScreenshot: "journey-10-complete"
