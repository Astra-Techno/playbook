# Reusable login subflow for player app
appId: com.kocourt.player
tags:
  - subflow
---
- tapOn:
    id: "nav_profile"
- assertVisible: "Continue"
- tapOn:
    id: "phone_input"
- inputText: "9000000099"
- tapOn: "Continue"
- assertVisible: "Verify & Continue"
- inputText: "1"
- inputText: "2"
- inputText: "3"
- inputText: "4"
- tapOn: "Verify & Continue"
  optional: true
- runFlow:
    when:
      visible: "YOUR FULL NAME"
    commands:
      - tapOn:
          id: "name_input"
      - inputText: "Test Player"
      - tapOn: "Create Account"
- assertVisible:
    id: "nav_explore"
