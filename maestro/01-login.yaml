# Login with demo OTP and verify profile tab is accessible
# Tags: smoke, auth
appId: com.kocourt.player
tags:
  - smoke
  - auth
---
- launchApp
- assertVisible:
    id: "nav_explore"

# Run login subflow
- runFlow: subflows/login.yaml

# Verify we're logged in — profile tab should show user content
- tapOn:
    id: "nav_profile"
- assertVisible: "Test Player"
  optional: true
- takeScreenshot: "login-complete"
