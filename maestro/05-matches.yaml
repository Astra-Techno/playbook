# Browse match requests, create a match
# Tags: social, matches
appId: com.kocourt.player
tags:
  - social
  - matches
---
- launchApp
- runFlow: subflows/login.yaml

# Navigate to Matches tab
- tapOn:
    id: "nav_matches"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: "matches-home"

# Scroll through match requests
- scroll:
    direction: DOWN
    duration: 1500
- waitForAnimationToEnd
- takeScreenshot: "matches-scrolled"

# Try creating a match request
- tapOn: "Create"
  optional: true
- tapOn: "New Match"
  optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: "matches-create"

# Go back if dialog opened
- back
  optional: true
