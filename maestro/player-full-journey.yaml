# Maestro Flow: Full Player Journey
# Simulates a complete user session — like a person who just downloaded the app.
# Login -> Browse -> View Court -> Check Feed -> Check Matches -> Profile
#
# Run: maestro test maestro/player-full-journey.yaml

appId: com.kocourt.player

---

# === PHASE 1: First Launch ===
- launchApp
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: "01-home"

# === PHASE 2: Browse Venues ===
# Scroll through venues like a curious user
- scroll:
    direction: DOWN
    duration: 1500
- waitForAnimationToEnd
- scroll:
    direction: DOWN
    duration: 1000
- waitForAnimationToEnd
- takeScreenshot: "02-venues-scrolled"

# Scroll back up
- scroll:
    direction: UP
    duration: 2500
- waitForAnimationToEnd

# === PHASE 3: Tap a Venue ===
- tapOn:
    index: 0
    retryTapIfNoChange: false
  optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: "03-court-detail"

# Explore the venue page
- scroll:
    direction: DOWN
    duration: 3000
- waitForAnimationToEnd
- takeScreenshot: "04-court-detail-bottom"

# Go back
- pressKey: back
- waitForAnimationToEnd

# === PHASE 4: Check Community Feed ===
- tapOn: "POSTS"
  optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: "05-feed"

# Scroll through posts
- scroll:
    direction: DOWN
    duration: 2000
- waitForAnimationToEnd

# === PHASE 5: Check Matches ===
- tapOn: "MATCHES"
  optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: "06-matches"

# === PHASE 6: Try Bookings (may show login prompt) ===
- tapOn: "BOOKINGS"
  optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: "07-bookings"

# === PHASE 7: Profile ===
- tapOn: "PROFILE"
  optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: "08-profile"

# === PHASE 8: Login if prompted ===
# Try entering phone number
- inputText: "9000000099"
  optional: true
- tapOn: "Send OTP"
  optional: true
- tapOn: "Continue"
  optional: true
- waitForAnimationToEnd:
    timeout: 5000

# Enter OTP
- inputText: "1234"
  optional: true
- tapOn: "Verify"
  optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: "09-logged-in"

# === PHASE 9: Post-Login Navigation ===
# Go to home and try booking
- tapOn: "HOME"
  optional: true
- waitForAnimationToEnd:
    timeout: 3000

# Tap first venue
- tapOn:
    index: 0
    retryTapIfNoChange: false
  optional: true
- waitForAnimationToEnd:
    timeout: 5000

# Try selecting a slot
- scroll:
    direction: DOWN
    duration: 1500
- waitForAnimationToEnd
- takeScreenshot: "10-slots-logged-in"

# Back to home
- pressKey: back
- waitForAnimationToEnd

# === PHASE 10: Check bookings tab (now logged in) ===
- tapOn: "BOOKINGS"
  optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: "11-my-bookings"

# === Done ===
- tapOn: "HOME"
  optional: true
- waitForAnimationToEnd
- takeScreenshot: "12-journey-complete"
