# Full player journey: login -> explore -> book -> feed -> matches -> profile
# Tags: e2e, full
appId: com.kocourt.player
tags:
  - e2e
  - full
---
- launchApp

# Phase 1: Login
- runFlow: subflows/login.yaml
- takeScreenshot: "journey-01-logged-in"

# Phase 2: Explore venues
- tapOn:
    id: "nav_explore"
- assertVisible:
    id: "nav_explore"
- scroll:
    direction: DOWN
    duration: 2000
- waitForAnimationToEnd
- takeScreenshot: "journey-02-explore"

# Phase 3: Open a court
- scroll:
    direction: UP
    duration: 2000
- scrollUntilVisible:
    element: "Book Now"
    direction: DOWN
    timeout: 10000
  optional: true
- tapOn: "Book Now"
  optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: "journey-03-court"
- scroll:
    direction: DOWN
    duration: 2000
- takeScreenshot: "journey-04-court-slots"
- back

# Phase 4: Feed
- tapOn:
    id: "nav_feed"
- waitForAnimationToEnd:
    timeout: 5000
- scroll:
    direction: DOWN
    duration: 1500
- takeScreenshot: "journey-05-feed"

# Phase 5: Matches
- tapOn:
    id: "nav_matches"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: "journey-06-matches"

# Phase 6: Bookings
- tapOn:
    id: "nav_bookings"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: "journey-07-bookings"

# Phase 7: Profile
- tapOn:
    id: "nav_profile"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: "journey-08-profile"

# Back to home
- tapOn:
    id: "nav_explore"
- takeScreenshot: "journey-09-complete"
