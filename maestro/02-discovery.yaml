# Browse courts, search, filter — no login required
# Tags: smoke, discovery
appId: com.kocourt.player
tags:
  - smoke
  - discovery
---
- launchApp
- assertVisible:
    id: "nav_explore"

# Home screen should show venues
- assertVisible: "Nearby"
  optional: true
- assertVisible: "Best review"
  optional: true
- takeScreenshot: "discovery-home"

# Scroll through venue list
- scroll:
    direction: DOWN
    duration: 1500
- waitForAnimationToEnd

# Scroll back and tap search
- scroll:
    direction: UP
    duration: 1500
- tapOn: "Open search filters"
  optional: true
- takeScreenshot: "discovery-filters"
- back
  optional: true

# Tap first venue card
- scrollUntilVisible:
    element: "Book Now"
    direction: DOWN
    timeout: 10000
  optional: true
- tapOn: "Book Now"
  optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: "discovery-court-detail"

# Scroll through court details
- scroll:
    direction: DOWN
    duration: 2000
- takeScreenshot: "discovery-court-detail-bottom"

# Go back
- back
