# PERSONA: Owner checking how much money they've made
# SCENARIO: Opens earnings tab, views revenue, checks payout settings
# Like checking your Stripe dashboard — today's revenue, pending payouts
tags:
  - earnings
  - revenue
---
- launchApp
- runFlow: subflows/login.yaml

# Tap Earnings tab (third tab in owner nav)
- tapOn: "Earnings"
  optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: "earnings-overview"

# Scroll to see breakdown
- scroll:
    direction: DOWN
    duration: 2000
- waitForAnimationToEnd
- takeScreenshot: "earnings-breakdown"

# Check venue-specific earnings if available
- tapOn:
    index: 0
    retryTapIfNoChange: false
  optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: "venue-earnings-detail"

# Go back
- back
  optional: true
