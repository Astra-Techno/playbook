# Login, browse a court, select a slot, attempt booking
# Tags: booking, auth
appId: com.kocourt.player
tags:
  - booking
  - auth
---
- launchApp
- runFlow: subflows/login.yaml

# Go to Explore tab
- tapOn:
    id: "nav_explore"
- assertVisible:
    id: "nav_explore"

# Find and tap a venue
- scrollUntilVisible:
    element: "Book Now"
    direction: DOWN
    timeout: 10000
  optional: true
- tapOn: "Book Now"
  optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: "booking-court-page"

# Scroll to slots section
- scrollUntilVisible:
    element: "Select Slot"
    direction: DOWN
    timeout: 10000
  optional: true
- takeScreenshot: "booking-slots"

# Try tapping an available slot (green/available)
- tapOn: "Select Slot"
  optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: "booking-slot-selected"

# If checkout button appears, tap it
- tapOn: "Proceed to Pay"
  optional: true
- tapOn: "Book Now"
  optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: "booking-checkout"

# Go back
- back
- back
  optional: true

# Check Bookings tab
- tapOn:
    id: "nav_bookings"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: "booking-my-bookings"
