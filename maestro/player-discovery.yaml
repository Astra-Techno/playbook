# Maestro Flow: Player Discovery
# Simulates a new user browsing the KoCourt player app.
# Tests: app launch, home screen, court cards, navigation.
#
# Install Maestro: curl -Ls "https://get.maestro.mobile.dev" | bash
# Run: maestro test maestro/player-discovery.yaml

appId: com.kocourt.player

---

# 1. App launches
- launchApp

# 2. Wait for home screen to load (venues)
- waitForAnimationToEnd:
    timeout: 10000

# 3. Verify bottom navigation is visible
- assertVisible: "HOME"
  optional: true
- assertVisible: "POSTS"
  optional: true

# 4. Scroll down to browse venues
- scroll:
    direction: DOWN
    duration: 2000
- waitForAnimationToEnd

# 5. Scroll back up
- scroll:
    direction: UP
    duration: 1000
- waitForAnimationToEnd

# 6. Tap on the first venue card (if visible)
- tapOn:
    index: 0
    retryTapIfNoChange: false
  optional: true
- waitForAnimationToEnd:
    timeout: 5000

# 7. Go back to home
- pressKey: back
- waitForAnimationToEnd

# 8. Navigate to Feed tab
- tapOn: "POSTS"
  optional: true
- waitForAnimationToEnd:
    timeout: 5000

# 9. Navigate to Matches tab
- tapOn: "MATCHES"
  optional: true
- waitForAnimationToEnd:
    timeout: 5000

# 10. Navigate to Bookings tab
- tapOn: "BOOKINGS"
  optional: true
- waitForAnimationToEnd:
    timeout: 5000

# 11. Navigate to Profile tab
- tapOn: "PROFILE"
  optional: true
- waitForAnimationToEnd:
    timeout: 5000

# 12. Go back to Home
- tapOn: "HOME"
  optional: true
- waitForAnimationToEnd
