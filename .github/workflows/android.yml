name: Android release (AAB + APK)

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Reachable HTTPS API URL baked into the release'
        type: string
        default: 'https://www.kocourt.com/api'

permissions:
  contents: read

concurrency:
  group: android-aab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: AAB ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each app has its own upload key, so each reads its own secrets:
          # <KEY>_KEYSTORE_BASE64, <KEY>_STORE_PASSWORD, <KEY>_KEY_ALIAS, <KEY>_KEY_PASSWORD
          - app: kocourt_flutter
            artifact: com.kocourt.player
            key: PLAYER
          - app: kocourt_owner
            artifact: kocourt-owner
            key: OWNER
    env:
      API_BASE_URL: ${{ inputs.api_base_url || 'https://www.kocourt.com/api' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Shared packages
        run: flutter pub get
        working-directory: kocourt_shared

      - name: App packages
        run: flutter pub get
        working-directory: ${{ matrix.app }}

      - name: Decode release keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets[format('{0}_KEYSTORE_BASE64', matrix.key)] }}
          STORE_PASSWORD: ${{ secrets[format('{0}_STORE_PASSWORD', matrix.key)] }}
          KEY_ALIAS: ${{ secrets[format('{0}_KEY_ALIAS', matrix.key)] }}
          KEY_PASSWORD: ${{ secrets[format('{0}_KEY_PASSWORD', matrix.key)] }}
        run: |
          # A debug-signed bundle is always rejected by Play, so stop instead of building one.
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing ${{ matrix.key }}_KEYSTORE_BASE64 / ${{ matrix.key }}_STORE_PASSWORD / ${{ matrix.key }}_KEY_ALIAS / ${{ matrix.key }}_KEY_PASSWORD repository secrets for ${{ matrix.app }}."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "${{ matrix.app }}/android/upload-keystore.jks"
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > "${{ matrix.app }}/android/key.properties"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build app bundle
        run: flutter build appbundle --release --dart-define="API_BASE_URL=$API_BASE_URL"
        working-directory: ${{ matrix.app }}

      - name: Build release APK (same upload key, for direct installs)
        run: flutter build apk --release --dart-define="API_BASE_URL=$API_BASE_URL"
        working-directory: ${{ matrix.app }}

      - name: Rename AAB and APK
        run: |
          src="${{ matrix.app }}/build/app/outputs/bundle/release/app-release.aab"
          cp "$src" "${{ matrix.artifact }}.aab"
          cp "${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk" "${{ matrix.artifact }}.apk"
          ls -lh "${{ matrix.artifact }}.aab" "${{ matrix.artifact }}.apk"

      - name: Check the bundle is not debug-signed
        run: |
          # The debug certificate's subject is "CN=Android Debug"; Play rejects it.
          if keytool -printcert -jarfile "${{ matrix.artifact }}.apk" | grep -q "CN=Android Debug"; then
            echo "::error::${{ matrix.artifact }} is signed with the debug key."
            exit 1
          fi
          keytool -printcert -jarfile "${{ matrix.artifact }}.apk" | grep -E "Owner:|SHA256:" | head -2

      - name: Job summary
        run: |
          {
            echo "## ${{ matrix.artifact }}.aab"
            echo ""
            echo "- App: \`${{ matrix.app }}\`"
            echo "- API: \`$API_BASE_URL\`"
            echo "- Signing: ${{ matrix.key }} upload key from repository secrets"
            echo "- Files: \`${{ matrix.artifact }}.aab\` (Play Console) and \`${{ matrix.artifact }}.apk\` (direct install)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-release-aab
          path: ${{ matrix.artifact }}.aab
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-release-apk
          path: ${{ matrix.artifact }}.apk
          if-no-files-found: error
