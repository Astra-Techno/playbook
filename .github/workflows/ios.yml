name: iOS Build and TestFlight

on:
  pull_request:
    paths:
      - 'kocourt_flutter/**'
      - 'kocourt_owner/**'
      - 'kocourt_shared/**'
      - '.github/workflows/ios.yml'
      - 'scripts/ios/**'
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: 'Sign and upload both apps to TestFlight (requires Apple secrets)'
        type: boolean
        default: false
      api_base_url:
        description: 'Reachable HTTPS API URL; use staging for test bookings'
        type: string
        default: 'https://www.kocourt.com/api'

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build:
    name: iOS ${{ matrix.app }}
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: kocourt_flutter
            bundle_id: com.kocourt.player
            profile_secret: IOS_PLAYER_PROFILE_BASE64
          - app: kocourt_owner
            bundle_id: com.kocourt.owner
            profile_secret: IOS_OWNER_PROFILE_BASE64
    env:
      APP_PATH: ${{ matrix.app }}
      BUNDLE_ID: ${{ matrix.bundle_id }}
      API_BASE_URL: ${{ inputs.api_base_url || 'https://www.kocourt.com/api' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: ${{ matrix.app }}
        run: flutter pub get
      - name: Validate native configuration
        run: |
          plutil -lint "$APP_PATH/ios/Runner/Info.plist"
          plutil -lint "$APP_PATH/ios/Runner.xcodeproj/project.pbxproj"
          ruby -c "$APP_PATH/ios/Podfile"
      - name: Analyze and test
        working-directory: ${{ matrix.app }}
        run: |
          # Existing apps have lint warnings/infos; compilation errors still fail.
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
      - name: Build without signing
        if: ${{ !inputs.upload_testflight }}
        working-directory: ${{ matrix.app }}
        run: flutter build ios --release --no-codesign --dart-define="API_BASE_URL=$API_BASE_URL"
      - name: Install signing credentials
        if: ${{ inputs.upload_testflight }}
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets[matrix.profile_secret] }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: bash scripts/ios/install-signing.sh
      - name: Build signed IPA
        if: ${{ inputs.upload_testflight }}
        working-directory: ${{ matrix.app }}
        env:
          IOS_BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          flutter build ipa --release --build-number="$IOS_BUILD_NUMBER" \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist" \
            --dart-define="API_BASE_URL=$API_BASE_URL"
      - name: Upload to TestFlight
        if: ${{ inputs.upload_testflight }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          API_PRIVATE_KEYS_DIR: ${{ runner.temp }}/appstore-keys
        run: |
          shopt -s nullglob
          ipas=("$APP_PATH"/build/ios/ipa/*.ipa)
          test "${#ipas[@]}" -eq 1
          xcrun altool --upload-app --type ios --file "${ipas[0]}" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Save signed IPA
        if: ${{ inputs.upload_testflight }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-ios-ipa
          path: ${{ matrix.app }}/build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Clean signing credentials
        if: ${{ always() && inputs.upload_testflight }}
        run: |
          security delete-keychain "$RUNNER_TEMP/kocourt-signing.keychain-db" || true
          rm -f "$APP_PATH/ios/Flutter/Signing.xcconfig"
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist"
          rm -f "$RUNNER_TEMP/ExportOptions.plist" "$RUNNER_TEMP/appstore-keys/"*.p8
          if [[ -f "$RUNNER_TEMP/installed-profile-path" ]]; then
            rm -f "$(cat "$RUNNER_TEMP/installed-profile-path")"
          fi
