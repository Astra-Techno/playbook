name: Quality Gate and Web Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Vue quality
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  flutter:
    name: Flutter ${{ matrix.app }}
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [kocourt_flutter, kocourt_owner]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: kocourt_shared
      - run: flutter analyze --no-fatal-infos
        working-directory: kocourt_shared
      - run: flutter test
        working-directory: kocourt_shared
      - run: flutter pub get
        working-directory: ${{ matrix.app }}
      - run: flutter analyze --no-fatal-infos
        working-directory: ${{ matrix.app }}
      - run: flutter test
        working-directory: ${{ matrix.app }}
      - run: flutter build apk --release
        working-directory: ${{ matrix.app }}
      - name: Rename APK
        run: |
          src="${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk"
          if [ "${{ matrix.app }}" = "kocourt_flutter" ]; then
            cp "$src" kocourt-player.apk
          else
            cp "$src" kocourt-owner.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-release-apk
          path: kocourt-*.apk

  api-check:
    name: PHP syntax check
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite
      - name: PHP syntax check
        run: find backend -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Commercial settings and checkout checks
        run: |
          php backend/tests/commerce_settings_test.php
          php backend/tests/commerce_checkout_test.php
          php backend/tests/commerce_cancellation_test.php
          php backend/tests/refund_service_test.php

  publish-web-build:
    name: Publish verified web build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]')
    needs: [web, flutter]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: public_html
      - uses: actions/download-artifact@v4
        with:
          name: kocourt_flutter-release-apk
          path: public_html/downloads
      - uses: actions/download-artifact@v4
        with:
          name: kocourt_owner-release-apk
          path: public_html/downloads
      - name: Commit verified build artifact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add public_html/
          git diff --staged --quiet || git commit -m 'build: update public_html [skip ci]'
          git push
